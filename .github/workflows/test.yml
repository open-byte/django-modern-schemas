name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test_coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group tests
      - name: Test with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/testapp
        run: uv run --group tests pytest --cov=django_modern_schemas --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
